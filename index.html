<!doctype html>
<html lang="de">

<style>
/* Layout: one-column phone app; pixel desert band on top, chunky square "block" panels, tab bar fixed at bottom */
:root{
  --bg:#f3dfb1; --panel:#fff6de; --ink:#3a2413; --muted:#7a5a3c; --line:#3a2413;
  --accent:#1d6fb8; --accent-ink:#ffffff; --accent-dark:#124d82;
  --terra:#c4553a; --green:#4c8a36; --green-dark:#2f5f24; --gold:#d99a14;
  --chip:#f8e6bb; --chip-on:#1d6fb8; --chip-on-ink:#ffffff;
  --sky:#8fd0f2; --sun:#ffd25a; --dune-far:#e8c07c; --dune-near:#d6a159; --palm:#3f7d33; --trunk:#8a5a2b; --house:#fbfbf6; --dome:#1d6fb8; --star-op:0; --camel:#b9803f;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a33; --panel:#1f2747; --ink:#f6e7c9; --muted:#b9aa8c; --line:#04060e;
  --accent:#4da3ea; --accent-ink:#0b1022; --accent-dark:#2a6ea8;
  --terra:#e2795d; --green:#6fbf5a; --green-dark:#3d8a31; --gold:#f2c04a;
  --chip:#2a3360; --chip-on:#4da3ea; --chip-on-ink:#0b1022;
  --sky:#1b2453; --sun:#f1e6b8; --dune-far:#3d3c60; --dune-near:#2d2c4a; --palm:#2e5a39; --trunk:#5b4030; --house:#c9cbe0; --dome:#2a6ea8; --star-op:1; --camel:#7a6488;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141a33; --panel:#1f2747; --ink:#f6e7c9; --muted:#b9aa8c; --line:#04060e;
  --accent:#4da3ea; --accent-ink:#0b1022; --accent-dark:#2a6ea8;
  --terra:#e2795d; --green:#6fbf5a; --green-dark:#3d8a31; --gold:#f2c04a;
  --chip:#2a3360; --chip-on:#4da3ea; --chip-on-ink:#0b1022;
  --sky:#1b2453; --sun:#f1e6b8; --dune-far:#3d3c60; --dune-near:#2d2c4a; --palm:#2e5a39; --trunk:#5b4030; --house:#c9cbe0; --dome:#2a6ea8; --star-op:1; --camel:#7a6488;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:1.6rem;line-height:1.15}
h2{font-size:1.25rem;line-height:1.2}
h3{font-size:1.05rem}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}

/* scene band */
.scene{position:relative;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;}
.scene svg.bg{display:block;width:100%;height:auto;max-height:190px}
.scene .over{position:absolute;inset:auto 0 6% 0;display:flex;align-items:flex-end;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fox{width:92px;height:92px;flex:none;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.18))}
.fox.sm{width:64px;height:64px}
.fox .eyes-open{animation:blinkO 5s infinite}
.fox .eyes-closed{opacity:0;animation:blinkC 5s infinite}
.fox.jump{animation:jump .5s ease-out 4}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}}
@keyframes blinkO{0%,92%{opacity:1}93%,97%{opacity:0}98%,100%{opacity:1}}
@keyframes blinkC{0%,92%{opacity:0}93%,97%{opacity:1}98%,100%{opacity:0}}
.bubble{position:relative;background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:10px 12px;font-weight:700;font-size:.98rem;line-height:1.35;margin-bottom:22px;min-width:0;flex:1}
.bubble::before{content:"";position:absolute;left:-12px;bottom:12px;width:12px;height:12px;background:var(--panel);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:skewY(-35deg)}

/* panels */
.panel{background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.title-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:16px}

/* stats */
.stats{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.dates{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.lvl{font-family:var(--f-display);font-size:1rem}
.bar{height:16px;border:3px solid var(--line);background:var(--chip);position:relative;grid-column:1 / -1}
.bar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--green) 0 10px,var(--green-dark) 10px 12px)}
.date-ico{width:22px;height:22px;flex:none}

/* day grid */
.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:560px){.days{grid-template-columns:repeat(3,minmax(0,1fr))}}
.day{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:10px;min-height:118px;position:relative}
.day:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.day:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.day .n{font-family:var(--f-display);font-size:1.15rem}
.day .d{font-size:.8rem;color:var(--muted);font-weight:700}
.day .st{margin-top:auto;font-size:.8rem;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:6px}
.day.today{background:var(--chip)}
.day .thumb{position:absolute;top:8px;right:8px;width:40px;height:40px;object-fit:cover;border:2px solid var(--line)}
.tag{display:inline-block;font-family:var(--f-display);font-size:.75rem;padding:1px 6px;border:2px solid var(--line)}
.tag.done{background:var(--green);color:#fff}
.tag.half{background:var(--gold);color:#2a1a08}
.tag.empty{background:transparent;color:var(--muted)}

/* buttons */
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem;padding:12px 16px;background:var(--accent);color:var(--accent-ink);border:3px solid var(--line);box-shadow:inset 0 -5px 0 var(--accent-dark),3px 3px 0 var(--line);display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:50px}
.btn:active{transform:translate(2px,2px);box-shadow:inset 0 -3px 0 var(--accent-dark),1px 1px 0 var(--line)}
.btn:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.btn.big{width:100%;font-size:1.2rem;min-height:58px}
.btn.green{background:var(--green);color:#fff;box-shadow:inset 0 -5px 0 var(--green-dark),3px 3px 0 var(--line)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:inset 0 -5px 0 var(--chip),3px 3px 0 var(--line)}
.btn.danger{background:var(--terra);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),3px 3px 0 var(--line)}
.btn[disabled]{opacity:.5;pointer-events:none}
.linkbtn{all:unset;cursor:pointer;font-weight:800;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:9px 12px;background:var(--chip);border:3px solid var(--line);font-weight:800;font-size:.98rem;min-height:46px}
.chip .em{font-size:1.25rem;line-height:1}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.chip:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.big-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.big-choices .chip{flex-direction:column;justify-content:center;min-height:96px;font-size:.95rem;text-align:center}
.big-choices .chip .em{font-size:2.2rem}

/* inputs */
label.lbl{font-weight:800;display:block;margin-bottom:6px}
.inp{width:100%;background:var(--bg);border:3px solid var(--line);padding:10px 12px;font-size:1rem;min-height:48px}
textarea.inp{min-height:120px;resize:vertical;line-height:1.45}

/* entry flow */
.ask{display:flex;gap:10px;align-items:flex-end;margin-top:12px}
.ask .bubble{margin-bottom:14px}
.prog{display:flex;gap:4px;margin-top:14px}
.prog i{flex:1;height:10px;border:2px solid var(--line);background:var(--chip)}
.prog i.on{background:var(--green)}
.prog i.cur{background:var(--gold)}
.navrow{display:flex;gap:12px;margin-top:4px}
.navrow .btn{flex:1}
.stars{display:flex;gap:6px;justify-content:center}
.star{all:unset;cursor:pointer;width:52px;height:52px;display:grid;place-items:center}
.star svg{width:46px;height:46px}
.star:focus-visible{outline:3px dashed var(--accent)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ph{position:relative;aspect-ratio:1;max-width:100%;border:3px solid var(--line);background:var(--chip);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{all:unset;cursor:pointer;position:absolute;top:4px;right:4px;background:var(--terra);color:#fff;font-family:var(--f-display);font-size:.8rem;padding:2px 7px;border:2px solid var(--line)}
.ph.add{display:grid;place-items:center;cursor:pointer;font-family:var(--f-display);text-align:center;padding:6px;font-size:.9rem}
.ph.add:focus-within{outline:3px dashed var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.quiz-opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:12px 14px;background:var(--chip);border:3px solid var(--line);font-weight:800;min-height:50px}
.quiz-opt.right{background:var(--green);color:#fff}
.quiz-opt.wrong{background:var(--terra);color:#fff}
.quiz-opt[disabled]{cursor:default}
.word{display:flex;align-items:center;gap:12px;padding:10px 12px;border:3px dashed var(--line);background:var(--bg)}
.word b{font-family:var(--f-display);font-size:1.3rem}

/* achievements */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ach{display:flex;gap:10px;align-items:center;padding:10px;border:3px solid var(--line);background:var(--panel);box-shadow:3px 3px 0 var(--line);min-width:0}
.ach .em{font-size:1.9rem;line-height:1;flex:none}
.ach b{font-family:var(--f-display);font-weight:700;display:block;line-height:1.15}
.ach span{font-size:.8rem;color:var(--muted);display:block;line-height:1.25}
.ach.locked{background:transparent;box-shadow:none;border-style:dashed}
.ach.locked .em{filter:grayscale(1);opacity:.35}
.ach.new{background:var(--gold);color:#2a1a08}
.ach.new span{color:#4a3210}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:3px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:640px}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;font-family:var(--f-display);font-size:.8rem;color:var(--muted)}
.tab .em{font-size:1.35rem;line-height:1}
.tab[aria-current="page"]{color:var(--ink);background:var(--chip);box-shadow:inset 0 4px 0 var(--accent)}
.tab:focus-visible{outline:3px dashed var(--accent);outline-offset:-4px}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--f-display);padding:10px 16px;border:3px solid var(--line);z-index:40;max-width:calc(100% - 32px);text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,8,20,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal .panel{width:100%;max-width:520px;max-height:85vh;overflow:auto}
.note{font-size:.85rem;color:var(--muted);border-left:4px solid var(--gold);padding-left:10px}
.big-num{font-family:var(--f-display);font-size:2.6rem;line-height:1;color:var(--green)}
.list-plain{margin:0;padding-left:20px}
/* Sprechblase unter der Szene, Fennek steht in der Wüste */
.scene .foxspot{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:4%}
.bubble.up{margin:14px 0 0;flex:none}
.bubble.up::before{left:34px;top:-12px;bottom:auto;width:14px;height:14px;border-left:3px solid var(--line);border-top:3px solid var(--line);border-bottom:0;transform:rotate(45deg) translate(2px,2px)}
/* Klare Schrift für Zahlen */
.dates,.big-num,.day .n,.day .st,.tag,.flyer,.quiz-opt,.stats .small{font-family:var(--f-body);font-weight:800}
/* verspielte Bewegung */
.scene .over{pointer-events:none}
.scene .over>*{pointer-events:auto}
.tappable,.fox,.bubble[data-act]{cursor:pointer}
.camel-walk{animation:walk 42s linear infinite}
.camel-step{animation:camelstep .6s steps(2) infinite}
@keyframes walk{from{transform:translateX(-16px)}to{transform:translateX(170px)}}
@keyframes camelstep{50%{transform:translateY(-.6px)}}
.hopg.hop{animation:chop .5s ease-out}
@keyframes chop{40%{transform:translateY(-7px)}}
.wiggle{animation:wiggle .5s steps(4)}
@keyframes wiggle{25%{transform:translateX(-1.2px)}75%{transform:translateX(1.2px)}}
.sun{transform-box:fill-box;transform-origin:center}
.sun.spin{animation:spin .8s steps(8)}
@keyframes spin{to{transform:rotate(360deg)}}
.fox.hop{animation:hop .45s ease-out}
@keyframes hop{40%{transform:translateY(-12px) scale(1.06,.94)}}
.fox.shake{animation:shake .45s steps(6)}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.chip[aria-pressed="true"],.star[aria-pressed="true"]{animation:pop .3s ease-out}
@keyframes pop{50%{transform:scale(1.1)}}
.enter{animation:slidein .28s ease-out}
.enter-back{animation:slideback .28s ease-out}
@keyframes slidein{from{transform:translateX(28px);opacity:.3}}
@keyframes slideback{from{transform:translateX(-28px);opacity:.3}}
.day{animation:tilein .35s ease-out backwards}
@keyframes tilein{from{transform:scale(.85)}}
.flyer{position:fixed;z-index:45;pointer-events:none;display:flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--green);text-shadow:2px 2px 0 var(--panel);animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.drop{position:fixed;z-index:45;pointer-events:none;animation:drop .9s cubic-bezier(.5,0,1,1) forwards}
@keyframes drop{70%{transform:translateY(var(--dy));opacity:1}85%{transform:translateY(calc(var(--dy) - 8px))}100%{transform:translateY(var(--dy));opacity:0}}
.rain{position:fixed;top:-30px;z-index:45;pointer-events:none;animation:rain linear forwards}
@keyframes rain{to{transform:translateY(110vh) rotate(var(--r))}}
.snd{all:unset;cursor:pointer;font-size:1.2rem;padding:4px 8px;border:3px solid var(--line);background:var(--panel);line-height:1.2;box-shadow:2px 2px 0 var(--line)}
.snd:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- Speicher (IndexedDB, mit Notfall im Arbeitsspeicher) ---------- */
const Store=(()=>{
  let dbp=null,ok=true;const mem=new Map();
  function open(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{try{const r=indexedDB.open("wuestenfuchs-tagebuch",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});
    return dbp;
  }
  async function get(k){try{const db=await open();return await new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(e){ok=false;return mem.get(k);}}
  async function set(k,v){try{const db=await open();await new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}catch(e){ok=false;mem.set(k,v);}}
  async function del(k){try{const db=await open();await new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}catch(e){mem.delete(k);}}
  return {get,set,del,get ok(){return ok;}};
})();

/* ---------- Logik: Punkte, Level, Erfolge ---------- */
function filled(e,k){if(!e)return false;switch(k){
  case"mood":return !!e.mood;case"weather":return !!e.weather;
  case"did":return (e.did&&e.did.length>0)||!!(e.didText&&e.didText.trim());
  case"animals":return (e.animals&&e.animals.length>0)||!!(e.animalText&&e.animalText.trim());
  case"food":return (e.food&&e.food.length>0)||!!(e.foodText&&e.foodText.trim());
  case"highlight":return !!(e.highlight&&e.highlight.trim());
  case"photos":return !!(e.photos&&e.photos.length);
  case"stars":return !!e.stars;case"quiz":return !!e.quiz;}return false;}
function complete(e){return filled(e,"mood")&&filled(e,"highlight")&&filled(e,"quiz");}
function started(e){return STEPS.some(k=>filled(e,k));}
function dayPoints(e){
  if(!e)return 0;let p=0;
  ["mood","weather","did","animals","food","stars"].forEach(k=>{if(filled(e,k))p+=5;});
  if(filled(e,"highlight"))p+=10;
  p+=Math.min(3,(e.photos||[]).length)*5;
  if(e.quiz)p+=e.quiz.correct?10:3;
  if(complete(e))p+=15;
  return p;
}
function total(){let t=0;for(let n=1;n<=S.days;n++)t+=dayPoints(S.entries[n]);return t;}
function level(t){let i=0;LEVELS.forEach((l,j)=>{if(t>=l[0])i=j;});const cur=LEVELS[i],nxt=LEVELS[i+1];return {name:cur[1],idx:i,next:nxt?nxt[1]:null,need:nxt?nxt[0]:null,pct:nxt?Math.round((t-cur[0])/(nxt[0]-cur[0])*100):100};}
function quizFor(n){return QUIZ[(n-1)%QUIZ.length];}
function stats(){
  const ents=[];for(let n=1;n<=S.days;n++)if(S.entries[n])ents.push(S.entries[n]);
  const animals=new Set();let photos=0,right=0,foodDays=0,done=0,words=0;
  ents.forEach(e=>{(e.animals||[]).forEach(a=>animals.add(a));photos+=(e.photos||[]).length;if(e.quiz&&e.quiz.correct)right++;if(e.quiz)words++;if(filled(e,"food"))foodDays++;if(complete(e))done++;});
  return {animals,photos,right,foodDays,done,words,any:ents.some(started)};
}

  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"});}
  catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});}
  const max=1280,w=bmp.width,h=bmp.height,sc=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);

   </section>
   <button class="btn big ${complete(e)?"ghost":"green"}" data-act="open" data-n="${n}">${complete(e)?`Tag ${n} ansehen`:started(e)?`Tag ${n} weiterschreiben`:`Tag ${n} aufschreiben`}</button>
   <div class="title-row"><h2>Alle Tage</h2><span class="small muted">${s.done} von ${S.days} fertig</span></div>
   <div class="days">${cards}</div>
   ${Store.ok?"":'<p class="note">Achtung: In diesem Browser kann gerade nichts dauerhaft gespeichert werden. Öffne das Tagebuch über das App-Symbol auf dem Startbildschirm.</p>'}

/* ---------- Teilen, Buch, Sicherung ---------- */
function dayText(n){
  const e=S.entries[n]||{},L=[];
  L.push(`📔 ${gen(S.traveller)||"Mein"} Reisetagebuch – Tag ${n}${dayLabel(n)?" ("+dayLabel(n)+")":""}`);
  const m=e.mood&&pick(MOODS,e.mood),w=e.weather&&pick(WEATHER,e.weather);
  if(m||w)L.push([m?`Laune: ${m.e} ${m.t}`:"",w?`Wetter: ${w.e} ${w.t}`:""].filter(Boolean).join(" | "));
  const lst=(arr,list,txt)=>[...(arr||[]).map(id=>{const x=pick(list,id);return x?x.e+" "+x.t:id;}),txt&&txt.trim()?txt.trim():""].filter(Boolean).join(", ");
  const d=lst(e.did,ACTS,e.didText);if(d)L.push("Gemacht: "+d);
  const a=lst(e.animals,ANIMALS,e.animalText);if(a)L.push("Tiere: "+a);
  const f=lst(e.food,FOODS,e.foodText);if(f)L.push("Essen: "+f);
  if(e.highlight&&e.highlight.trim())L.push("Highlight: "+e.highlight.trim());
  if(e.stars)L.push("Bewertung: "+"★".repeat(e.stars)+"☆".repeat(5-e.stars));
  if(e.quiz){const Q=quizFor(n);L.push(`Quiz: ${e.quiz.correct?"richtig ✓":"knapp daneben"} · Neues Wort: ${Q.w[0]} = ${Q.w[1]}`);}
  L.push(`Datteln heute: +${dayPoints(e)}`);
  return L.join("\n");
}
async function shareDay(n){
  const text=dayText(n),e=S.entries[n]||{},files=[];
  for(let i=0;i<(e.photos||[]).length;i++){const b=await Store.get("photo:"+e.photos[i]);if(b)files.push(new File([b],`tag${n}-foto${i+1}.jpg`,{type:"image/jpeg"}));}
  try{
    if(navigator.share){
      const data={title:`Reisetagebuch Tag ${n}`,text};
      if(files.length&&navigator.canShare&&navigator.canShare({files}))data.files=files;
      await navigator.share(data);toast("Abgeschickt!");return;
    }
  }catch(err){if(err&&err.name==="AbortError")return;}
  modal(`<h2>Tag ${n} zum Kopieren</h2><p class="small muted">Teilen geht hier nicht direkt. Kopier den Text und füge ihn in eine Nachricht ein.</p><textarea class="inp" id="share-txt" readonly style="min-height:200px">${esc(text)}</textarea><div class="row"><button class="btn" data-act="copy">Kopieren</button><button class="btn ghost" data-act="close">Schließen</button></div>`);
}
async function buildBook(){
  const parts=[];
  for(let n=1;n<=S.days;n++){
    const e=S.entries[n];if(!started(e))continue;
    let imgs="";for(const id of (e.photos||[])){const b=await Store.get("photo:"+id);if(b)imgs+=`<img src="${await blobToDataURL(b)}" alt="">`;}
    const lines=dayText(n).split("\n").slice(1,-1).map(l=>`<p>${esc(l)}</p>`).join("");
    parts.push(`<section><h2>Tag ${n}${dayLabel(n)?" · "+esc(dayLabel(n)):""}</h2>${lines}<div class="imgs">${imgs}</div></section>`);
  }
  const t=total();
  return `<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(gen(S.traveller)||"Mein")} Reisetagebuch Tunesien</title><style>body{font-family:system-ui,sans-serif;background:#f3dfb1;color:#3a2413;margin:0;padding:24px 16px;line-height:1.5}main{max-width:700px;margin:0 auto}h1{font-family:monospace;font-size:1.8rem}section{background:#fff6de;border:3px solid #3a2413;box-shadow:4px 4px 0 #3a2413;padding:16px;margin:18px 0}h2{font-family:monospace;margin:0 0 8px}p{margin:4px 0}.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}.imgs img{width:100%;border:3px solid #3a2413}</style></head><body><main><h1>${esc(gen(S.traveller)||"Mein")} Reisetagebuch Tunesien</h1><p>Gesammelt mit ${esc(S.fox)}, dem Wüstenfuchs · ${t} Datteln · ${level(t).name}</p>${parts.join("")||"<p>Noch keine Einträge.</p>"}</main></body></html>`;
}
function download(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
async function bookShare(){
  const html=await buildBook(),file=new File([html],"Reisetagebuch-Tunesien.html",{type:"text/html"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Reisetagebuch Tunesien"});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  toast("Teilen klappt hier nicht. Nimm „Buch speichern“.");
}
async function bookDl(){const html=await buildBook();download(new Blob([html],{type:"text/html"}),"Reisetagebuch-Tunesien.html");toast("Buch wird gespeichert …");}
async function backup(){
  const photos={};for(let n=1;n<=S.days;n++){for(const id of ((S.entries[n]||{}).photos||[])){const b=await Store.get("photo:"+id);if(b)photos[id]=await blobToDataURL(b);}}
  const json=JSON.stringify({app:"wuestenfuchs-tagebuch",v:1,state:S,photos});
  download(new Blob([json],{type:"application/json"}),"Reisetagebuch-Sicherung.json");toast("Sicherung wird gespeichert …");
}
async function restore(file){
  try{
    const d=JSON.parse(await file.text());if(d.app!=="wuestenfuchs-tagebuch"||!d.state)throw new Error();
    for(const [id,u] of Object.entries(d.photos||{}))await Store.set("photo:"+id,await dataURLToBlob(u));
    S=Object.assign(blank(),d.state);urlCache.clear();await save(true);UI.view="home";render();toast("Sicherung geladen!");
  }catch(e){toast("Diese Datei ist keine Tagebuch-Sicherung.");}
}

document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act;
  if(act!=="delphoto"&&act!=="wipe")UI.confirm=null;
  const before=UI.view==="entry"?dayPoints(E(UI.day)):0,px=ev.clientX,py=ev.clientY;
  switch(act){
   case"fox":fx(b,"hop");snd("hop");say(FOX_LINES[Math.floor(Math.random()*FOX_LINES.length)]);break;
   case"sun":fx(b,"spin");snd("tap");say(isDark()?"Qamar heißt Mond. Gute Nacht, Wüste!":"Schams heißt Sonne. Heute wird's bestimmt wieder heiß!");break;
   case"palm":fx(b,"wiggle");snd("drop");dropDate(b);say("Plopp! Eine Dattel. In Tunesien wachsen ganz viele davon.");break;
   case"camel":fx(b,"hop");snd("hop");say("Dschamal heißt Kamel. Wo es wohl hinläuft?");break;
   case"house":fx(b,"wiggle");snd("tap");say("Weiße Häuser mit blauen Türen gibt es in Sidi Bou Said bei Tunis.");break;
   case"bubble":if(b.dataset.full){clearInterval(typeT);b.textContent=b.dataset.full;}break;
   case"snd":S.sound=S.sound===false;save();snd("pop");rerenderKeepScroll();break;
   case"tab":UI.view=b.dataset.id;render();break;
   case"home":UI.view="home";render();break;
   case"open":openDay(+b.dataset.n);break;
   case"set":{const e=E(UI.day),f=b.dataset.f;let v=b.dataset.v;if(f==="stars")v=+v;e[f]=(e[f]===v&&f!=="stars")?null:v;save();UI.fx="hop";snd("pop");rerenderKeepScroll();gain(before,px,py);break;}
   case"toggle":{const e=E(UI.day),f=b.dataset.f,v=b.dataset.v;e[f]=e[f]||[];const i=e[f].indexOf(v);if(i>=0)e[f].splice(i,1);else e[f].push(v);save();b.setAttribute("aria-pressed",i<0);updateNext();snd(i<0?"pop":"tap");if(i<0)fx($(".ask .fox"),"hop");gain(before,px,py);break;}
   case"quiz":{const e=E(UI.day);if(e.quiz)break;const v=+b.dataset.v,Q=quizFor(UI.day);e.quiz={choice:v,correct:v===Q.a};save(true);snd(e.quiz.correct?"right":"wrong");UI.fx=e.quiz.correct?"hop":"shake";rerenderKeepScroll();gain(before,px,py);break;}
   case"next":snd("tap");if(UI.step<STEPS.length-1){UI.step++;UI.anim="enter";render();}else finishDay();break;
   case"prev":snd("tap");if(UI.step>0){UI.step--;UI.anim="enter-back";render();}break;
   case"delphoto":{const id=b.dataset.id;if(UI.confirm!==id){UI.confirm=id;rerenderKeepScroll();break;}const e=E(UI.day);e.photos=e.photos.filter(x=>x!==id);await Store.del("photo:"+id);UI.confirm=null;save(true);rerenderKeepScroll();break;}
   case"share":shareDay(+b.dataset.n);break;
   case"book-share":bookShare();break;
   case"book-dl":bookDl();break;
   case"backup":backup();break;
   case"copy":{const ta=$("#share-txt");try{await navigator.clipboard.writeText(ta.value);toast("Kopiert!");}catch(e){ta.focus();ta.select();toast("Text markiert, jetzt kopieren.");}break;}
   case"close":closeModal();break;
   case"wipe":{if(UI.confirm!=="wipe"){UI.confirm="wipe";rerenderKeepScroll();break;}for(const n in S.entries)for(const id of (S.entries[n].photos||[]))await Store.del("photo:"+id);S=blank();urlCache.clear();UI.confirm=null;await save(true);render();toast("Tagebuch gelöscht.");break;}
  }
});
function updateNext(){const e=E(UI.day),k=STEPS[UI.step];const btns=document.querySelectorAll('[data-act="next"]');btns.forEach(btn=>{const last=UI.step===STEPS.length-1;btn.className="btn "+(filled(e,k)?"green":"ghost");btn.textContent=last?"Fertig":filled(e,k)?"Weiter":"Überspringen";});document.querySelectorAll(".prog i").forEach((el,i)=>{el.className=i===UI.step?"cur":filled(e,STEPS[i])?"on":"";});}
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset&&t.dataset.text){const e=E(UI.day),before=dayPoints(e);e[t.dataset.text]=t.value;save();updateNext();const g=dayPoints(e)-before;if(g>0){const r=t.getBoundingClientRect();flyer(r.right-70,r.top,g);}}});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="photo-in"&&t.files&&t.files[0])addPhoto(t.files[0]);
  if(t.id==="restore-in"&&t.files&&t.files[0])restore(t.files[0]);
});
function readForm(p){
  S.traveller=$("#"+p+"-name").value.trim();
  S.fox=$("#"+p+"-fox").value.trim()||"Fenni";
  S.start=$("#"+p+"-start").value||"";
  const d=parseInt($("#"+p+"-days").value,10);S.days=Math.min(21,Math.max(1,isNaN(d)?6:d));
}
document.addEventListener("submit",ev=>{
  ev.preventDefault();
  if(ev.target.id==="setup"){readForm("f");S.setupDone=true;save(true);UI.view="home";render();}
  if(ev.target.id==="settings"){readForm("s");save(true);render();toast("Gespeichert!");}
});

(async function boot(){
  const saved=await Store.get("state");
  S=Object.assign(blank(),saved||{});
  render();
  try{if(navigator.storage&&navigator.storage.persist){S.persisted=await navigator.storage.persist();save();}}catch(e){}
  try{if("serviceWorker" in navigator&&location.protocol==="https:"&&!inFrame()&&window.__SW__)navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
})();
</script>
</body>
