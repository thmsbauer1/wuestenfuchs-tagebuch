<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4c8a36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Fenneks Lern-Oase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-column app; growing pixel oasis on top, chunky block panels, custom number pad, tab bar at bottom */
:root{
  --bg:#f3dfb1; --panel:#fff6de; --ink:#3a2413; --muted:#7a5a3c; --line:#3a2413;
  --accent:#1d6fb8; --accent-ink:#ffffff; --accent-dark:#124d82;
  --terra:#c4553a; --green:#4c8a36; --green-dark:#2f5f24; --gold:#d99a14;
  --chip:#f8e6bb; --chip-on:#1d6fb8; --chip-on-ink:#ffffff;
  --math:#c4553a; --eng:#1d6fb8; --deu:#4c8a36;
  --sky:#8fd0f2; --sun:#ffd25a; --dune-far:#e8c07c; --dune-near:#d6a159; --palm:#3f7d33; --trunk:#8a5a2b; --house:#fbfbf6; --dome:#1d6fb8; --water:#4fb3d9; --water2:#8fd6ef; --camel:#b9803f; --tent:#c4553a; --tent2:#f3dfb1; --clay:#d9a066; --clay2:#c08a52; --star-op:0;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a33; --panel:#1f2747; --ink:#f6e7c9; --muted:#b9aa8c; --line:#04060e;
  --accent:#4da3ea; --accent-ink:#0b1022; --accent-dark:#2a6ea8;
  --terra:#e2795d; --green:#6fbf5a; --green-dark:#3d8a31; --gold:#f2c04a;
  --chip:#2a3360; --chip-on:#4da3ea; --chip-on-ink:#0b1022;
  --math:#e2795d; --eng:#4da3ea; --deu:#6fbf5a;
  --sky:#1b2453; --sun:#f1e6b8; --dune-far:#3d3c60; --dune-near:#2d2c4a; --palm:#2e5a39; --trunk:#5b4030; --house:#c9cbe0; --dome:#2a6ea8; --water:#2a5f9e; --water2:#4d82c0; --camel:#7a6488; --tent:#a8503d; --tent2:#5a5470; --clay:#6e5d70; --clay2:#5a4b5e; --star-op:1;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141a33; --panel:#1f2747; --ink:#f6e7c9; --muted:#b9aa8c; --line:#04060e;
  --accent:#4da3ea; --accent-ink:#0b1022; --accent-dark:#2a6ea8;
  --terra:#e2795d; --green:#6fbf5a; --green-dark:#3d8a31; --gold:#f2c04a;
  --chip:#2a3360; --chip-on:#4da3ea; --chip-on-ink:#0b1022;
  --math:#e2795d; --eng:#4da3ea; --deu:#6fbf5a;
  --sky:#1b2453; --sun:#f1e6b8; --dune-far:#3d3c60; --dune-near:#2d2c4a; --palm:#2e5a39; --trunk:#5b4030; --house:#c9cbe0; --dome:#2a6ea8; --water:#2a5f9e; --water2:#4d82c0; --camel:#7a6488; --tent:#a8503d; --tent2:#5a5470; --clay:#6e5d70; --clay2:#5a4b5e; --star-op:1;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:1.55rem;line-height:1.15}
h2{font-size:1.2rem;line-height:1.2}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.panel{background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:14px}

/* Oase */
.scene{position:relative;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.scene svg.bg{display:block;width:100%;height:auto;max-height:230px}
.scene .foxspot{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:4%}
.fox{width:84px;height:84px;flex:none;cursor:pointer;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.18))}
.fox.sm{width:60px;height:60px}
.fox .eyes-open{animation:blinkO 5s infinite}
.fox .eyes-closed{opacity:0;animation:blinkC 5s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blinkO{0%,92%{opacity:1}93%,97%{opacity:0}98%,100%{opacity:1}}
@keyframes blinkC{0%,92%{opacity:0}93%,97%{opacity:1}98%,100%{opacity:0}}
.fox.hop{animation:hop .45s ease-out}
@keyframes hop{40%{transform:translateY(-12px) scale(1.06,.94)}}
.fox.shake{animation:shake .45s steps(6)}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.item-new{animation:itemnew 1.2s ease-out}
@keyframes itemnew{0%{transform:translateY(-14px);opacity:0}60%{transform:translateY(2px);opacity:1}100%{transform:none}}
.fire{animation:flicker .5s steps(2) infinite}
@keyframes flicker{50%{transform:translateY(-.5px)}}
.birds{animation:birds 26s linear infinite}
@keyframes birds{from{transform:translateX(-20px)}to{transform:translateX(180px)}}
.tappable{cursor:pointer}
.camel-walk{animation:walk 42s linear infinite}
.camel-step{animation:camelstep .6s steps(2) infinite}
@keyframes walk{from{transform:translateX(-16px)}to{transform:translateX(170px)}}
@keyframes camelstep{50%{transform:translateY(-.6px)}}
.hopg.hop{animation:chop .5s ease-out}
@keyframes chop{40%{transform:translateY(-7px)}}
.ship{animation:ship 38s linear infinite}
@keyframes ship{0%{transform:translate(-22px,12px)}32%{transform:translate(172px,3px)}100%{transform:translate(172px,3px)}}
.ship .flame{animation:flicker .3s steps(2) infinite}
.wiggle{animation:wiggle .5s steps(4)}
@keyframes wiggle{25%{transform:translateX(-1.2px)}75%{transform:translateX(1.2px)}}
.bubble{position:relative;background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:10px 12px;font-weight:700;font-size:.98rem;line-height:1.35;min-width:0;flex:1;cursor:pointer}
.bubble.up{margin-top:14px}
.bubble.up::before{content:"";position:absolute;left:34px;top:-12px;width:14px;height:14px;background:var(--panel);border-left:3px solid var(--line);border-top:3px solid var(--line);transform:rotate(45deg) translate(2px,2px)}
.ask{display:flex;gap:10px;align-items:flex-end}
.ask .bubble::before{content:"";position:absolute;left:-12px;bottom:12px;width:12px;height:12px;background:var(--panel);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:skewY(-35deg)}

/* stats */
.stats{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.dates{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.date-ico{width:22px;height:22px;flex:none}
.week{display:flex;gap:6px;justify-content:flex-end}
.week i{width:18px;height:18px;border:3px solid var(--line);background:var(--chip)}
.week i.on{background:var(--gold)}
.bar{height:14px;border:3px solid var(--line);background:var(--chip);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--green) 0 10px,var(--green-dark) 10px 12px)}

/* buttons */
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem;padding:12px 16px;background:var(--accent);color:var(--accent-ink);border:3px solid var(--line);box-shadow:inset 0 -5px 0 var(--accent-dark),3px 3px 0 var(--line);display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:50px}
.btn:active{transform:translate(2px,2px);box-shadow:inset 0 -3px 0 var(--accent-dark),1px 1px 0 var(--line)}
.btn:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.btn.big{width:100%;font-size:1.2rem;min-height:58px}
.btn.green{background:var(--green);color:#fff;box-shadow:inset 0 -5px 0 var(--green-dark),3px 3px 0 var(--line)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:inset 0 -5px 0 var(--chip),3px 3px 0 var(--line)}
.btn.danger{background:var(--terra);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),3px 3px 0 var(--line)}
.linkbtn{all:unset;cursor:pointer;font-weight:800;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.snd{all:unset;cursor:pointer;font-size:1.2rem;padding:4px 8px;border:3px solid var(--line);background:var(--panel);line-height:1.2;box-shadow:2px 2px 0 var(--line)}

/* subject cards */
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.subj{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:10px;border:3px solid var(--line);background:var(--panel);box-shadow:4px 4px 0 var(--line);min-height:108px;position:relative;overflow:hidden}
.subj::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.subj:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.subj:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.subj .em{font-size:1.6rem;line-height:1;margin-top:6px}
.subj b{font-family:var(--f-display);font-size:1.05rem}
.subj span{font-size:.78rem;color:var(--muted);font-weight:700;line-height:1.25}

/* task */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.prog{display:flex;gap:3px;margin-top:10px}
.prog i{flex:1;height:10px;border:2px solid var(--line);background:var(--chip)}
.prog i.ok{background:var(--green)}
.prog i.no{background:var(--terra)}
.prog i.cur{background:var(--gold)}
.tag{display:inline-block;font-family:var(--f-display);font-size:.8rem;padding:2px 8px;border:2px solid var(--line);color:#fff;background:var(--c)}
.q{font-size:1.25rem;font-weight:800;line-height:1.35}
.q.big{font-family:var(--f-display);font-size:2.1rem;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.q .hl{background:var(--gold);color:#2a1a08;padding:0 6px;border:2px solid var(--line)}
.gap{display:inline-block;min-width:1.6em;border-bottom:4px solid var(--accent);text-align:center;color:var(--accent)}
.answer{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:2rem;min-height:64px;border:3px solid var(--line);background:var(--bg);font-variant-numeric:tabular-nums}
.answer .unit{font-size:1.1rem;color:var(--muted)}
.answer .cursor{width:3px;height:1.4em;background:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-family:var(--f-display);font-size:1.6rem;min-height:58px;display:grid;place-items:center;background:var(--chip);border:3px solid var(--line);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.key:active{transform:translateY(2px);box-shadow:none}
.key.ok{background:var(--green);color:#fff}
.key:focus-visible{outline:3px dashed var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:12px 14px;background:var(--chip);border:3px solid var(--line);font-weight:800;font-size:1.1rem;min-height:52px}
.opt.right{background:var(--green);color:#fff}
.opt.wrong{background:var(--terra);color:#fff}
.opt[disabled]{cursor:default}
.opt:focus-visible{outline:3px dashed var(--accent)}
.opts.grid{display:grid;grid-template-columns:repeat(3,1fr)}
.opts.grid .opt{text-align:center;font-family:var(--f-display);font-size:1.5rem}
select.inp{min-height:48px}
.inp{width:100%;background:var(--bg);border:3px solid var(--line);padding:12px;font-size:1.3rem;font-weight:800;min-height:56px}
.fb{border:3px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--green);color:#fff}
.fb.no{background:var(--panel);border-left:10px solid var(--terra)}
.fb.near{background:var(--panel);border-left:10px solid var(--gold)}
.fb b.big{font-family:var(--f-display);font-size:1.3rem}
.col{font-family:"Courier New",monospace;font-weight:800;font-size:1.6rem;line-height:1.25;display:inline-grid;justify-items:end;padding:6px 10px;background:var(--bg);border:3px solid var(--line)}
.col .line{width:100%;border-top:3px solid var(--ink);margin-top:2px}
.wall{display:flex;flex-direction:column;align-items:center;gap:4px}
.wall .r{display:flex;gap:4px}
.wall .b{min-width:58px;padding:6px 4px;text-align:center;font-family:var(--f-display);font-size:1.25rem;background:var(--chip);border:3px solid var(--line)}
.wall .b.ask{background:var(--gold);color:#2a1a08}
.speak{all:unset;cursor:pointer;font-weight:800;padding:6px 10px;border:3px solid currentColor;display:inline-flex;gap:6px;align-items:center}

/* words + misc */
.wlist{display:flex;flex-direction:column;gap:8px}
.w{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border:3px solid var(--line);background:var(--panel)}
.w .en{font-weight:800}
.w .de{font-size:.85rem;color:var(--muted)}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:14px;border:2px solid var(--line);background:var(--chip)}
.pips i.on{background:var(--green)}
.w .say{all:unset;cursor:pointer;font-size:1.2rem;padding:2px 6px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:3px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:640px}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;font-family:var(--f-display);font-size:.8rem;color:var(--muted)}
.tab .em{font-size:1.35rem;line-height:1}
.tab[aria-current="page"]{color:var(--ink);background:var(--chip);box-shadow:inset 0 4px 0 var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--f-display);padding:10px 16px;border:3px solid var(--line);z-index:40;max-width:calc(100% - 32px);text-align:center}
.note{font-size:.85rem;color:var(--muted);border-left:4px solid var(--gold);padding-left:10px}
.flyer{position:fixed;z-index:45;pointer-events:none;display:flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--green);text-shadow:2px 2px 0 var(--panel);animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.rain{position:fixed;top:-30px;z-index:45;pointer-events:none;animation:rain linear forwards}
@keyframes rain{to{transform:translateY(110vh) rotate(var(--r))}}
.enter{animation:slidein .28s ease-out}
@keyframes slidein{from{transform:translateX(28px);opacity:.3}}
.big-num{font-family:var(--f-display);font-size:2.6rem;line-height:1;color:var(--green)}
textarea.inp{min-height:180px;font-size:.9rem;font-weight:600}
label.lbl{font-weight:800;display:block;margin-bottom:6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:8px 12px;border:3px solid var(--line);background:var(--chip);font-weight:800}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
/* Klare Schrift für Zahlen und Aufgaben: die Pixelschrift bleibt für Überschriften und Knöpfe */
.dates,.q,.q.big,.answer,.key,.big-num,.wall .b,.flyer,.fb b.big,.tag,.opt,.opts.grid .opt,.subj span,.week+div{font-family:var(--f-body);font-weight:800}
.q.big{letter-spacing:0}
.key{font-size:1.7rem}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>window.__SW__=true;</script>
<div id="app" class="wrap"></div>
<div id="tabs"></div>
<div id="layer"></div>

<script src="inhalte.js"></script>
<script>
"use strict";
/* ---------- Grundlagen ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickA=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const r10=n=>Math.round(n/10)*10;
const fmt=n=>n.toLocaleString("de-DE");
function today(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(key,n){const d=new Date(key+"T12:00:00");d.setDate(d.getDate()+n);return today(d);}
function weekKeys(){const d=new Date();d.setHours(12,0,0,0);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);const k=[];for(let i=0;i<7;i++){k.push(today(d));d.setDate(d.getDate()+1);}return k;}

/* ---------- Speicher ---------- */
const KEY="fennek-lernoase-v1";let memStore=null,storeOk=true;
function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null;}catch(e){storeOk=false;return memStore;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storeOk=false;memStore=JSON.parse(JSON.stringify(S));}}
function blank(){return {v:1,name:"",sound:true,pitch:1.6,voice:"",newPerDay:5,len:"normal",dates:0,missions:{},m:{},en:{},de:{},hist:{},setupDone:false};}
let S=Object.assign(blank(),load()||{});

/* ---------- Pixel-Grafik ---------- */
const FOX=[".oo..............oo.",".ofo............ofo.",".opfo..........ofpo.",".oppfo........ofppo.",".opppfo......ofpppo.",".oppppfoooooofppppo.",".oppffffffffffffppo.",".opffffffffffffffpo.","..offffffffffffffo..","..offweffffffweffo..","..offeeffffffeeffo..","..ofkffllllllffkfo..","...offllllllllffo...","...offlllnnlllffo...","....ofllllllllfo....",".....oooooooooo.....","....offllllllffo....","...offfllllllfffo.oo","...offfllllllfffoofo","...oooooooooooooooo."];
const FOXC={o:"#5a3a22",f:"#e9b46f",l:"#fdebc8",p:"#f4a3a0",e:"#1d1a17",w:"#ffffff",n:"#1d1a17",k:"#f08a7e"};
let FOX_INNER=null;
function foxSVG(cls){
  if(!FOX_INNER){let body="",open="",closed="";
    FOX.forEach((row,y)=>[...row].forEach((c,x)=>{if(c===".")return;const r=col=>`<rect x="${x}" y="${y}" width="1.04" height="1.04" fill="${col}"/>`;
      if((c==="e"||c==="w")&&(y===9||y===10)){open+=r(FOXC[c]);closed+=r(y===10?FOXC.o:FOXC.f);}else body+=r(FOXC[c]);}));
    FOX_INNER=`${body}<g class="eyes-open">${open}</g><g class="eyes-closed">${closed}</g>`;}
  return `<svg class="fox ${cls||""}" data-act="fox" viewBox="0 0 20 20" shape-rendering="crispEdges" role="img" aria-label="Fennek">${FOX_INNER}</svg>`;

function norm(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,!?;:"]/g,"").replace(/\s+/g," ").trim();}

function enTasks(n){

    if(Math.random()<.5&&L<3)[a,b]=[b,a];return {q:`${a} · ${b}`,big:true,a:a*b,expl:ex||`${a} · ${b} = ${a*b}`};},
  geteilt(L){let d,q;if(L===1){d=pickA([2,3,4,5,10]);q=R(2,10);}else if(L===2){d=R(3,9);q=R(3,10);}else{d=R(2,9);q=R(11,20);}
    const p=d*q;return {q:`${p} : ${d}`,big:true,a:q,expl:`Umkehraufgabe: ${q} · ${d} = ${p}`};},
  begriffe(L){const ops=L===1?["+","−"]:["+","−","·",":"];const op=pickA(ops);let x,y,z;

    const T={"+":["1. Summand","2. Summand","Wert der Summe"],"−":["Minuend","Subtrahend","Wert der Differenz"],"·":["1. Faktor","2. Faktor","Wert des Produkts"],":":["Dividend","Divisor","Wert des Quotienten"]}[op];

    return {kind:"mc",q:`<div class="q big">${nums[0]} ${op} ${nums[1]} = ${nums[2]}</div><p class="q" style="text-align:center">Wie heißt die markierte Zahl?</p>`,raw:true,o,a:o.indexOf(T[pos]),expl:`${x} ${op} ${y} = ${z}: ${T[0]} ${op} ${T[1]} = ${T[2]}`};},
  ueberschlag(L){let a,b,op=L===1?"+":pickA(["+","−"]);
    if(L===1){a=R(12,98);b=R(12,98);}else if(L===2){a=R(102,499);b=R(12,99);}else{a=R(150,999);b=R(102,499);}
    if(op==="−"&&b>a)[a,b]=[b,a];const ra=r10(a),rb=r10(b),res=op==="+"?ra+rb:ra-rb;
    return {q:`<p class="small muted">Runde auf Zehner und rechne:</p><div class="q big">${a} ${op} ${b}</div>`,raw:true,a:res,expl:`${a} ≈ ${ra} und ${b} ≈ ${rb}, also ${ra} ${op} ${rb} = ${res}. (Genau: ${op==="+"?a+b:a-b})`};},
  luecke(L){const forms=L===1?["a+?","?+b","a-?"]:["a+?","?+b","a-?","?-b","a*?","?:b"];const f=pickA(forms);let s,ans,ex;const G='<span class="gap">?</span>';
    if(f==="a+?"){const a=R(12,80),x=R(5,L===1?19:99);s=`${a} + ${G} = ${a+x}`;ans=x;ex=`${a+x} − ${a} = ${x}`;}
    else if(f==="?+b"){const x=R(12,80),b=R(5,L===1?19:99);s=`${G} + ${b} = ${x+b}`;ans=x;ex=`${x+b} − ${b} = ${x}`;}
    else if(f==="a-?"){const a=R(30,99),x=R(5,a-10);s=`${a} − ${G} = ${a-x}`;ans=x;ex=`${a} − ${a-x} = ${x}`;}

  probe(L){const a=R(L===1?30:100,L===1?99:999),b=R(11,Math.min(99,a-5));const right=a-b;const wrong=Math.random()<.5;let shown=wrong?right+pickA([1,-1,10,-10]):right;if(shown<0)shown=right+10;const ok=!wrong;const o=["Stimmt","Stimmt nicht"];
    return {kind:"mc",q:`<p class="q" style="text-align:center">Stimmt die Rechnung? Mach die Probe!</p><div class="q big">${a} − ${b} = ${shown}</div>`,raw:true,o,a:ok?0:1,grid:false,expl:`Umkehraufgabe: ${shown} + ${b} = ${shown+b}. ${shown+b===a?"Das ist "+a+", also stimmt es.":"Das ist nicht "+a+". Richtig wäre "+right+"."}`};},
  schriftlich(L){let a,b,op;if(L===1){op="+";a=R(120,689);b=R(110,299);}else if(L===2){op=pickA(["+","−"]);a=R(300,999);b=R(105,a-50);if(op==="+"){a=R(1200,6999);b=R(345,2999);}}else{op=pickA(["+","−"]);a=R(2000,9999);b=R(1111,a-100);}
    const res=op==="+"?a+b:a-b;const w=String(Math.max(a,b,res)).length+1;const pad=n=>String(n).padStart(w," ").replace(/ /g,"&nbsp;");
    return {q:`<p class="q" style="text-align:center">Rechne schriftlich:</p><div style="text-align:center"><div class="col"><span>${pad(a)}</span><span>${op==="+"?"+":"−"}${pad(b).slice(6)}</span><span class="line"></span></div></div>`,raw:true,a:res,expl:`Von rechts nach links Stelle für Stelle rechnen${op==="+"?", Übertrag nicht vergessen":", beim Entbündeln aufpassen"}. Ergebnis: ${fmt(res)}`};},
  text(L){const [n,p]=pickA(S.name?NAMES.concat([[S.name,"er"]]):NAMES);const P=p.charAt(0).toUpperCase()+p.slice(1);
    const T=[
      ()=>{const p1=R(5,L===1?20:39),p2=R(3,L===1?15:29),bill=p1+p2<=20?20:p1+p2<=50?50:100;return {t:`${n} kauft ein Comic für ${p1} € und eine Taschenlampe für ${p2} €. ${P} bezahlt mit einem ${bill}-€-Schein. Wie viel Wechselgeld bekommt ${p}?`,a:bill-p1-p2,u:"€",ex:`${p1} + ${p2} = ${p1+p2}, dann ${bill} − ${p1+p2} = ${bill-p1-p2}`};},
      ()=>{const a=R(L===1?40:120,L===1?99:640),b=R(12,Math.min(a-5,L===1?39:250));return {t:`In Minecraft hat ${n} schon ${a} Blöcke gesammelt. Für einen Turm braucht ${p} ${b} Blöcke. Wie viele Blöcke bleiben übrig?`,a:a-b,u:"Blöcke",ex:`${a} − ${b} = ${a-b}`};},

function mTask(skill){const g=GEN[skill](lvl(skill));return Object.assign({subj:"m",kind:g.kind||"num",skill},g);}
function mTasks(n){
  const acc=k=>{const s=S.m[k];return s&&s.n?s.ok/s.n:.6;};
  const fixed=["plus","minus",pickA(["mal","geteilt"]),"text"];
  const rest=Object.keys(SKILLS).filter(k=>!fixed.includes(k));
  const chosen=fixed.slice(0,Math.min(4,n));
  while(chosen.length<n){const w=rest.map(k=>({k,w:1.4-acc(k)+(chosen.includes(k)?-0.9:0)+Math.random()*.6})).sort((a,b)=>b.w-a.w);chosen.push(w[0].k);}
  return shuffle(chosen).map(mTask);
}
function mUpdate(skill,ok){const s=S.m[skill]||{lvl:1,run:0,ok:0,n:0};s.n++;if(ok){s.ok++;s.run=Math.max(s.run,0)+1;if(s.run>=3&&s.lvl<3){s.lvl++;s.run=0;UI.levelUp=SKILLS[skill];}}else{s.run=Math.min(s.run,0)-1;if(s.run<=-2&&s.lvl>1){s.lvl--;s.run=0;}}S.m[skill]=s;}

  const s=SUBJ[t.subj];const num=r.tasks.slice(0,r.i+1).filter(x=>!x.intro&&x.subj===t.subj).length,tot=r.tasks.filter(x=>!x.intro&&x.subj===t.subj).length;
  const A=UI.answered;
  let fox=A?(A.res==="ok"?pickA(PRAISE):A.res==="near"?"Fast richtig! Achte auf die Schreibweise.":pickA(COMFORT)):taskPrompt(t);
  if(A&&UI.levelUp){fox=`Stufe hoch bei „${UI.levelUp}“! Jetzt wird's etwas schwieriger.`;UI.levelUp=null;}
  return `<div class="topbar">${exitLbl}<span class="tag" style="--c:${s.c}">${s.em} ${s.n} ${num}/${tot}</span></div>
  <div class="prog">${segs}</div>
  <div class="ask" style="margin-top:12px">${foxSVG("sm")}<p class="bubble" data-act="bubble">${esc(fox)}</p></div>
  <div class="panel stack ${UI.anim?"enter":""}" style="margin-top:14px">${taskBody(t,A)}</div>
  ${A?`<div class="stack" style="margin-top:14px">${feedback(t,A)}<button class="btn big green" data-act="next" id="next-btn">Weiter</button></div>`:""}`;
}
function taskPrompt(t){
  if(t.subj==="e")return t.kind==="mc"?"Was heißt das auf Englisch? Tipp die richtige Antwort an.":"Was heißt das auf Englisch? Schreib es auf.";
  if(t.subj==="d")return {gap:"Welche Buchstaben fehlen?",gross:"Welches Wort muss man großschreiben?",wortart:"Welche Wortart ist das?",fehler:"Ein Wort ist falsch geschrieben. Welches?"}[t.item.kind];
  return {plus:"Rechne im Kopf!",minus:"Rechne im Kopf!",mal:"Einmaleins!",geteilt:"Wie oft passt es rein?",begriffe:"Kennst du die Fachbegriffe?",ueberschlag:"Erst runden, dann rechnen!",luecke:"Welche Zahl fehlt?",mauer:"Bau die Mauer fertig!",probe:"Mach die Probe!",schriftlich:"Stellenweise rechnen!",text:"Lies genau und rechne!"}[t.skill];
}
function optsHTML(o,a,A,grid){return `<div class="opts ${grid?"grid":""}">${o.map((x,i)=>{let c="";if(A){if(i===a)c="right";else if(i===A.val)c="wrong";}return `<button class="opt ${c}" data-act="pick" data-v="${i}" ${A?"disabled":""}>${esc(x)}</button>`;}).join("")}</div>`;}
function taskBody(t,A){
  if(t.subj==="m"){
    const qh=t.raw?t.q:`<div class="q big">${t.q} = ?</div>`;
    if(t.kind==="mc")return qh+optsHTML(t.o,t.a,A);
    const shown=A?A.val:UI.input;
    return qh+`<div class="answer" aria-live="polite"><span>${esc(shown||"")}</span>${A?"":'<span class="cursor"></span>'}${t.unit?`<span class="unit">${esc(t.unit)}</span>`:""}</div>`+(A?"":`<div class="pad">${[7,8,9,4,5,6,1,2,3].map(k=>`<button class="key" data-act="key" data-k="${k}">${k}</button>`).join("")}<button class="key" data-act="key" data-k="back" aria-label="Löschen">⌫</button><button class="key" data-act="key" data-k="0">0</button><button class="key ok" data-act="key" data-k="ok" aria-label="Prüfen">✓</button></div>`);
  }
  if(t.subj==="e"){
    const q=`<p class="small muted">Auf Deutsch:</p><p class="q" style="font-size:1.5rem">${esc(t.w.de)}</p>`;
    if(t.kind==="mc")return q+optsHTML(t.o,t.a,A);
    if(A)return q+`<div class="answer" style="justify-content:flex-start;padding:0 12px;font-family:var(--f-body);font-weight:800;font-size:1.4rem">${esc(A.val)||"—"}</div>`;
    return q+`<form id="en-form" class="stack"><input class="inp" id="en-in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="auf Englisch …" value="${esc(UI.input)}"><button class="btn big" type="submit">Prüfen</button></form>`;
  }
  const d=t.item;let q="";
  if(d.kind==="gap")q=`<p class="q big" style="font-size:2.2rem">${esc(d.pre)}<span class="gap">${A?esc(d.o[d.a]):"?"}</span>${esc(d.post)}</p>`;
  else if(d.kind==="gross")q=`<p class="q" style="font-size:1.35rem">${esc(d.s)}</p>`;
  else if(d.kind==="wortart")q=`<p class="q big">${esc(d.w)}</p>`;
  else q=`<p class="small muted">Tipp das falsch geschriebene Wort an.</p>`;
  return q+optsHTML(d.o,d.a,A,d.kind==="gap");
}
function feedback(t,A){
  const ok=A.res==="ok";let head="",body="";
  if(t.subj==="m"){head=ok?"Richtig!":`Richtig ist: ${t.kind==="mc"?esc(t.o[t.a]):fmt(t.a)+(t.unit?" "+esc(t.unit):"")}`;body=t.explRaw?t.expl:esc(t.expl||"");}
  else if(t.subj==="e"){const main=t.w.en[0];head=ok?`Richtig: ${esc(main)}`:A.res==="near"?`Fast! Richtig geschrieben: ${esc(main)}`:`Richtig ist: ${esc(main)}`;body=(t.w.en.length>1?`Auch richtig: ${esc(t.w.en.slice(1).join(", "))}. `:"")+esc(t.w.note||"");body+=` <button class="speak" data-act="speak" data-t="${esc(main)}">🔊 Anhören</button>`;}
  else{const d=t.item;head=ok?"Richtig!":(d.kind==="gap"?`Richtig: ${esc(d.w)}`:d.kind==="fehler"?`Richtig wäre: ${esc(d.c)}`:`Richtig: ${esc(d.o[d.a])}`);body=esc(d.tip||"");}
  return `<div class="fb ${ok?"ok":A.res==="near"?"near":"no"}" role="status"><b class="big">${head}</b>${body?`<div>${body}</div>`:""}</div>`;
}
function vDone(){
  const r=UI.run,res=r.res.filter(Boolean),ok=res.filter(x=>x!=="no").length;const ni=UI.done.newItem;
  const isM=r.type==="mission";
  const msg=ni>=0?`Juhu! Neu in deiner Oase: ${OASE[ni].n}!`:isM?"Mission nochmal geschafft! Fleißiger Fuchs!":"Training geschafft! Weiter so!";
  return `<div class="scene">${oaseSVG(ni)}<div class="foxspot">${foxSVG("hop")}</div></div>
  <p class="bubble up" data-act="bubble">${msg}</p>
  <div class="stack" style="margin-top:16px">
   <section class="panel stack" style="align-items:center;text-align:center">
    <p class="disp">${isM?"Mission geschafft!":"Training geschafft!"}</p>
    <div class="row" style="justify-content:center">${dateSVG()}<span class="big-num">+${r.earned}</span></div>
    <p><b>${ok} von ${res.length}</b> Aufgaben richtig${r.weekBonus?" · Wochenziel erreicht, +25 Bonus!":""}</p>
   </section>
   <button class="btn big green" data-act="home">Zur Oase</button>
  </div>`;
}
function vWords(){
  const groups={};WORDS.forEach(w=>{(groups[w.unit]=groups[w.unit]||[]).push(w);});
  return `<div class="stack" style="margin-top:20px">
   <div class="ask">${foxSVG("sm")}<p class="bubble" data-act="bubble">Tipp auf den Lautsprecher, dann sage ich dir das Wort auf Englisch vor.</p></div>
   <h1>Meine Vokabeln</h1>
   <p class="small muted">Die grünen Balken zeigen, wie sicher du ein Wort schon kannst. Bei fünf ist es im Langzeitgedächtnis.</p>
   ${Object.entries(groups).map(([u,ws])=>`<h2>${esc(u)}</h2><div class="wlist">${ws.map(w=>{const b=(enState(w.id)||{}).box||0;return `<div class="w"><div style="min-width:0"><div class="en">${esc(w.en[0])}</div><div class="de">${esc(w.de)}</div></div><div class="pips" aria-label="Stufe ${b} von 5">${[1,2,3,4,5].map(i=>`<i class="${b>=i?"on":""}"></i>`).join("")}</div><button class="say" data-act="speak" data-t="${esc(w.en[0])}" aria-label="${esc(w.en[0])} anhören">🔊</button></div>`;}).join("")}</div>`).join("")}
  </div>`;
}
function report(){
  const keys=[];for(let i=6;i>=0;i--)keys.push(addDays(today(),-i));
  const sum={m:[0,0],e:[0,0],d:[0,0]};keys.forEach(k=>{const h=S.hist[k];if(h)["m","e","d"].forEach(s=>{sum[s][0]+=h[s][0];sum[s][1]+=h[s][1];});});
  const pct=s=>s[1]?Math.round(s[0]/s[1]*100)+" % richtig ("+s[1]+" Aufgaben)":"noch nicht geübt";
  const missions=keys.filter(k=>S.missions[k]).length;
  const weakM=Object.keys(SKILLS).filter(k=>S.m[k]&&S.m[k].n>=3&&S.m[k].ok/S.m[k].n<.7).map(k=>SKILLS[k]);
  const hardW=WORDS.filter(w=>(enState(w.id)||{}).miss>=2).map(w=>w.en[0]);
  const known=WORDS.filter(w=>(enState(w.id)||{}).box>=3).length,started=WORDS.filter(w=>enState(w.id)).length;
  const deWeak={};DE.forEach(d=>{const s=S.de[d.id];if(s&&s.last===false)deWeak[DE_CAT[d.cat]]=(deWeak[DE_CAT[d.cat]]||0)+1;});
  const L=[`Lern-Oase · Wochenbericht${S.name?" für "+S.name:""}`,`Missionen in den letzten 7 Tagen: ${missions}`,"",
    `Mathe: ${pct(sum.m)}`,`  Stufen: ${Object.keys(SKILLS).map(k=>SKILLS[k]+" "+lvl(k)).join(", ")}`,weakM.length?`  Noch unsicher: ${weakM.join(", ")}`:"  Keine Schwachstelle auffällig.","",
    `Englisch: ${pct(sum.e)}`,`  Vokabeln: ${known} sicher, ${started} angefangen, ${WORDS.length} insgesamt`,hardW.length?`  Schwierige Wörter: ${hardW.slice(0,12).join(", ")}`:"","",
    `Deutsch: ${pct(sum.d)}`,Object.keys(deWeak).length?`  Zuletzt falsch bei: ${Object.entries(deWeak).map(([k,v])=>k+" ("+v+")").join(", ")}`:"  Keine Schwachstelle auffällig."];
  return L.filter((x,i,a)=>!(x===""&&a[i-1]==="")).join("\n");
}
function vParents(){
  const c=UI.confirm;
  return `<div class="stack" style="margin-top:20px">
   <h1>Für Eltern</h1>
   <section class="panel stack"><h2>Wochenbericht</h2><textarea class="inp" id="rep" readonly>${esc(report())}</textarea>
    <div class="row"><button class="btn" data-act="share-rep">Teilen</button><button class="btn ghost" data-act="copy-rep">Kopieren</button></div></section>
   <section class="panel stack"><h2>Einstellungen</h2>
    <div><label class="lbl" for="s-name">Name</label><input class="inp" id="s-name" value="${esc(S.name)}" style="font-size:1rem"></div>
    <div><span class="lbl">Länge der Mission</span><div class="seg"><button data-act="len" data-v="kurz" aria-pressed="${S.len==="kurz"}">Kurz (ca. 8 Min.)</button><button data-act="len" data-v="normal" aria-pressed="${S.len!=="kurz"}">Normal (ca. 12 Min.)</button></div></div>
    <div><span class="lbl">Neue Vokabeln pro Tag</span><div class="seg">${[3,5,8].map(n=>`<button data-act="npd" data-v="${n}" aria-pressed="${(S.newPerDay||5)===n}">${n}</button>`).join("")}</div></div>
    <div><span class="lbl">Fenni-Stimme fürs Englische</span>
     ${enVoices().length?`<select class="inp" id="s-voice" style="font-size:1rem">${enVoices().map(v=>`<option value="${esc(v.voiceURI)}" ${VOICE&&VOICE.voiceURI===v.voiceURI?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("")}</select>`:`<p class="small muted">Dieses Gerät hat keine englische Stimme gemeldet. Unter Android hilft es, in den Einstellungen bei „Text-in-Sprache“ eine englische Stimme zu laden.</p>`}
     <div class="seg" style="margin-top:8px">${[[1,"Normal"],[1.35,"Hell"],[1.6,"Fennek"],[1.9,"Sehr hell"]].map(([p,l])=>`<button data-act="pitch" data-v="${p}" aria-pressed="${(S.pitch||1.6)===p}">${l}</button>`).join("")}</div>
     <button class="btn ghost" data-act="voice-test" style="margin-top:10px">🔊 Probe hören</button></div>
    <button class="btn green" data-act="save-set">Speichern</button>
    <button class="btn ${c==="wipe"?"danger":"ghost"}" data-act="wipe">${c==="wipe"?"Wirklich alles löschen? Nochmal tippen":"Fortschritt komplett zurücksetzen"}</button>
   </section>
   <p class="note">Alles bleibt auf diesem Gerät. Neue Vokabeln und Aufgaben kommen per Update dazu, der Fortschritt bleibt dabei erhalten.</p>
  </div>`;
}

/* ---------- Eingaben ---------- */
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;
  if(act!=="wipe")UI.confirm=null;
  switch(act){
   case"tab":UI.view=b.dataset.id;render();break;
   case"home":UI.view="home";render();break;
   case"start":startRun(b.dataset.type);break;
   case"quit":UI.view="home";UI.run=null;render();break;
   case"next":next();break;
   case"pick":answer(+b.dataset.v,ev);break;
   case"key":{const k=b.dataset.k;if(k==="ok"){if(UI.input!=="")answer(UI.input,ev);else say("Tipp zuerst deine Zahl ein.");}else{if(k==="back")UI.input=UI.input.slice(0,-1);else if(UI.input.length<6)UI.input+=k;snd("tap");const sp=$(".answer span");if(sp)sp.textContent=UI.input;}break;}
   case"speak":speak(b.dataset.t);break;
   case"fox":fx(b,"hop");snd("hop");say(pickA(["Hihi, das kitzelt!","Lernen macht Durst. Zum Glück haben wir eine Wasserstelle!","Weißt du was? Fenneks hören sogar Käfer unter dem Sand.","Yalla! Weiter geht's!","Jede Mission bringt was Neues in die Oase."]));break;
   case"sun":snd("tap");say("Schams heißt Sonne. Und sun auf Englisch!");break;
   case"camel":fx(b,"hop");snd("hop");say(pickA(["Hüpf! Kamel heißt auf Englisch camel. Fast gleich!","Das Dromedar hat nur einen Höcker. Auf Englisch: dromedary.","Hopp, hopp! Wo läuft das Kamel wohl hin?"]));break;
   case"ksar":snd("tap");fx(b,"wiggle");say("Das ist ein Ksar, eine alte Speicherburg der Berber in Südtunesien. In solchen Burgen wurden auch Szenen für Star Wars gedreht!");break;
   case"baby":snd("tap");say("Pssst, das Kamel-Baby schläft. Auf Englisch heißt es baby camel.");break;
   case"ship":snd("hop");say("Das ist meine Wüsten-Rakete! Wusstest du: Teile von Star Wars wurden in der Wüste von Tunesien gedreht.");break;
   case"bubble":if(b.dataset.full){clearInterval(typeT);b.textContent=b.dataset.full;}break;
   case"snd":S.sound=S.sound===false;save();render();snd("pop");break;
   case"len":S.len=b.dataset.v;save();render();break;
   case"npd":S.newPerDay=+b.dataset.v;save();render();break;
   case"pitch":S.pitch=+b.dataset.v;save();render();speak("Hello! I am Fenni.");break;
   case"voice-test":speak("Hello! I am Fenni, the fennec fox. Let's learn English!");break;
   case"save-set":S.name=$("#s-name").value.trim();save();toast("Gespeichert!");render();break;
   case"copy-rep":{const ta=$("#rep");try{await navigator.clipboard.writeText(ta.value);toast("Kopiert!");}catch(e){ta.focus();ta.select();toast("Text markiert, jetzt kopieren.");}break;}
   case"share-rep":{const text=report();try{if(navigator.share){await navigator.share({title:"Lern-Oase Wochenbericht",text});return;}}catch(e){if(e&&e.name==="AbortError")return;}toast("Teilen geht hier nicht. Nimm „Kopieren“.");break;}
   case"wipe":if(UI.confirm!=="wipe"){UI.confirm="wipe";render();break;}{const nm=S.name;S=blank();S.name=nm;S.setupDone=true;UI.confirm=null;save();render();toast("Fortschritt zurückgesetzt.");}break;
  }
});
document.addEventListener("submit",ev=>{
  ev.preventDefault();
  if(ev.target.id==="setup"){S.name=$("#f-name").value.trim();S.setupDone=true;save();render();}
  if(ev.target.id==="en-form"){const v=$("#en-in").value;if(!v.trim()){say("Schreib zuerst ein Wort.");return;}answer(v,null);}
});
document.addEventListener("input",ev=>{if(ev.target.id==="en-in")UI.input=ev.target.value;});
document.addEventListener("change",ev=>{if(ev.target.id==="s-voice"){S.voice=ev.target.value;save();pickVoice();speak("Hello! I am Fenni.");}});
document.addEventListener("keydown",ev=>{
  if(UI.view!=="task")return;const t=cur();if(!t)return;
  if(UI.answered&&(ev.key==="Enter")){ev.preventDefault();next();return;}
  if(!UI.answered&&t.subj==="m"&&t.kind==="num"&&!t.intro){
    if(/^[0-9]$/.test(ev.key)&&UI.input.length<6){UI.input+=ev.key;const sp=$(".answer span");if(sp)sp.textContent=UI.input;}
    else if(ev.key==="Backspace"){UI.input=UI.input.slice(0,-1);const sp=$(".answer span");if(sp)sp.textContent=UI.input;}
    else if(ev.key==="Enter"&&UI.input)answer(UI.input,null);
  }
});
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&window.self===window.top&&window.__SW__)navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
</script>
</body>
